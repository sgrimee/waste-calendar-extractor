[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
    "matplotlib>=3.10.3",
]

[project]
name = "waste-cal"
version = "0.1.0"
description = "Extract waste collection dates from PDF calendars and generate iCal files"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sam Grimee", email = "sgrimee@users.noreply.github.com" }]
keywords = ["waste", "calendar", "pdf", "ical", "luxembourg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = ["PyMuPDF>=1.23.0", "ics>=0.7", "loguru>=0.7.3"]


[tool.hatch.build.targets.wheel]
packages = ["waste-cal"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []


[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require PDF file, may be excluded from CI)",
]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
    "*.egg-info",
    ".git",
    ".tox",
    "build",
    "dist",
    "temp",
    "unused",
]
