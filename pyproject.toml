[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1", 
    "ruff>=0.11.13",
    "mypy>=1.16.0",
]

[project]
name = "waste-calendar-extractor"
version = "0.1.0"
description = "Extract waste collection dates from PDF calendars and generate iCal files"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sam Grimee", email = "sgrimee@users.noreply.github.com" }]
keywords = ["waste", "calendar", "pdf", "ical", "luxembourg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = ["PyMuPDF>=1.23.0", "ics>=0.7"]


[project.scripts]
extract-waste-dates = "waste_calendar_extractor:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/icons",
    "/waste-2025.ics",
    "/README.md",
    "/LICENSE",
    "/justfile"
]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
